[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-wave1-report"
version = "0.2.1"
description = "Consolidate SZL harness receipt chains into one verifiable Wave 1 report — fail closed on any broken chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-wave1-report"
Source = "https://github.com/szl-holdings/szl-wave1-report"
Issues = "https://github.com/szl-holdings/szl-wave1-report/issues"
Changelog = "https://github.com/szl-holdings/szl-wave1-report/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_wave1_report"] # wheel top-level import names; the release gate fails if the built wheel differs
